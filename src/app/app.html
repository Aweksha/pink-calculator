<a class="skip-link" href="#main">Skip to calculator</a>

<header class="app-header">
  <div class="brand">
    <img src="favicon.svg" alt="" width="36" height="36" />
    <div>
      <p class="brand-name">Pink Calculator</p>
      <p class="brand-tag">Scientific · Graphing · Tools</p>
    </div>
  </div>
  <button
    type="button"
    class="btn small theme-toggle"
    (click)="settings.cycleTheme()"
    [attr.aria-label]="themeLabel() + '. Click to change'"
    [title]="themeLabel()"
  >
    <span aria-hidden="true">{{ themeIcon() }}</span>
    <span class="theme-text">{{ themeLabel() }}</span>
  </button>
</header>

<app-mode-toggle />

<main id="main" class="app-main" tabindex="-1">
  <router-outlet />
</main>

<div class="app-footer">
  <app-disclaimer />
  <p class="credits">
    Built with Angular, TypeScript &amp; mathjs. Calculations run entirely in your browser.
  </p>
</div>
